name: Named Routes CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: named-routes-ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package · ${{ matrix.os }} · Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        # 22.12 is the minimum since 2.0 (require(esm), native recursive watch).
        node: ["22.12.0", "22", "24", "26"]
        include:
          - os: windows-latest
            node: "24"
          - os: macos-latest
            node: "24"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      # Biome lint/format, unit and integration tests, type contracts.
      - run: pnpm check
      - run: pnpm test:package

  types:
    name: Type contracts · TypeScript ${{ matrix.typescript }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The exported types need 5.4+ since 2.0 (also the Zod 4 / Valibot 1
        # minimum) · everything with @types/node 26: 5.9+
        typescript: ["5.4", "5.9", "6", "7"]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Install TypeScript ${{ matrix.typescript }} outside the project
        run: npm install --prefix "$RUNNER_TEMP/ts" --no-audit --no-fund "typescript@${{ matrix.typescript }}"
      - name: Runtime contracts (hrefs, match, typed query)
        run: node "$RUNNER_TEMP/ts/node_modules/typescript/bin/tsc" -p tests/tsconfig.runtime.json
      - name: Zod and Valibot contracts
        run: node "$RUNNER_TEMP/ts/node_modules/typescript/bin/tsc" -p tests/tsconfig.schemas.json
      - name: All contracts with Node.js types
        if: matrix.typescript != '5.4'
        run: node "$RUNNER_TEMP/ts/node_modules/typescript/bin/tsc" -p tests/tsconfig.json

  docs:
    name: Languages and documentation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # Every language has every section, paragraph and interface key.
      - run: node scripts/sync-locales.mjs --check
      # README.*.md and docs/<code>/*.md match docs/content.json and docs/groups.json.
      - run: python scripts/sync-docs.py --check

  frameworks:
    name: Real Next.js and Vite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm build
      - name: Install the Next.js example dependencies
        run: pnpm --dir examples/app-router install --frozen-lockfile --ignore-scripts
      # next dev + next build/start (webpack) and the real typedRoutes contract.
      - run: pnpm test:next
      - run: pnpm test:vite

  website:
    name: Documentation website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # The website installs the package from .. and needs its dist/.
      - run: pnpm build
      - run: pnpm --dir website install --frozen-lockfile --ignore-scripts
      - run: pnpm --dir website run check:i18n
      - run: pnpm --dir website run typecheck
      - run: pnpm --dir website run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
