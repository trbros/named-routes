name: Publish Named Routes

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: named-routes-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  release-info:
    if: startsWith(github.event.release.tag_name, 'named-routes-v')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dist-tag: ${{ steps.release.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Match the release tag and package version
        id: release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        run: node scripts/check-release.mjs

  validate:
    needs: release-info
    uses: ./.github/workflows/named-routes-ci.yml

  # Every example with its real framework, installed from the packed tarball.
  e2e:
    needs: release-info
    uses: ./.github/workflows/named-routes-e2e.yml

  publish:
    needs: [release-info, validate, e2e]
    runs-on: ubuntu-latest
    # Must match "Environment name" in the npm Trusted Publisher settings. The
    # environment requires a reviewer's approval and only accepts
    # named-routes-v* tags, so nothing else can obtain the publishing token.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@triooo/named-routes
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - name: Use an npm CLI supporting trusted publishing
        run: npm install --global 'npm@^11.5.1'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # npm validates "bin" (dist/cli.js) when it reads package.json, before
      # prepack runs; without dist/ it warns and may drop the bin entry.
      - run: pnpm build
      - name: Link provenance to the actual publishing repository
        run: node scripts/prepare-publish.mjs
      - name: Publish through npm OIDC
        env:
          NPM_CONFIG_TAG: ${{ needs.release-info.outputs.dist-tag }}
        run: npm publish --access public --provenance
