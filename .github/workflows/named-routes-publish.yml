name: Publish Named Routes

# Pushing a named-routes-vX.Y.Z tag publishes that version: the tag is
# validated against package.json and the CHANGELOG, CI and E2E run again, npm
# publishing waits for the npm-publish approval, and the GitHub release is then
# created from the CHANGELOG section (skipped if it already exists).
on:
  push:
    tags:
      - "named-routes-v*"

permissions:
  contents: read

concurrency:
  group: named-routes-publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-info:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      dist-tag: ${{ steps.release.outputs.dist_tag }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Match the tag, package version and CHANGELOG
        id: release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node scripts/check-release.mjs

  validate:
    needs: release-info
    uses: ./.github/workflows/named-routes-ci.yml

  # Every example with its real framework, installed from the packed tarball.
  e2e:
    needs: release-info
    uses: ./.github/workflows/named-routes-e2e.yml

  publish:
    needs: [release-info, validate, e2e]
    runs-on: ubuntu-latest
    # Must match "Environment name" in the npm Trusted Publisher settings. The
    # environment requires a reviewer's approval and only accepts
    # named-routes-v* tags, so nothing else can obtain the publishing token.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@triooo/named-routes
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      # The pnpm version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v6
      - name: Use an npm CLI supporting trusted publishing
        run: npm install --global 'npm@^11.5.1'
      - run: pnpm install --frozen-lockfile --ignore-scripts
      # npm validates "bin" (dist/cli.js) when it reads package.json, before
      # prepack runs; without dist/ it warns and may drop the bin entry.
      - run: pnpm build
      - name: Link provenance to the actual publishing repository
        run: node scripts/prepare-publish.mjs
      - name: Publish through npm OIDC
        env:
          NPM_CONFIG_TAG: ${{ needs.release-info.outputs.dist-tag }}
        run: npm publish --access public --provenance

  # Created with GITHUB_TOKEN, so it does not trigger other workflows.
  github-release:
    needs: [release-info, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Extract the release notes from the CHANGELOG
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
        run: node scripts/check-release.mjs
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_NOTES_FILE: ${{ runner.temp }}/release-notes.md
          PRERELEASE: ${{ needs.release-info.outputs.prerelease }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 0
          fi
          if [ "$PRERELEASE" = "true" ]; then kind=--prerelease; else kind=--latest; fi
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "named-routes ${RELEASE_TAG#named-routes-}" \
            --notes-file "$RELEASE_NOTES_FILE" "$kind"
