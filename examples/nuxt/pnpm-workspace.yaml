allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.5.45'
  - '@vue/compiler-dom@3.5.45'
  - '@vue/compiler-sfc@3.5.45'
  - '@vue/compiler-ssr@3.5.45'
  - '@vue/reactivity@3.5.45'
  - '@vue/runtime-core@3.5.45'
  - '@vue/runtime-dom@3.5.45'
  - '@vue/server-renderer@3.5.45'
  - '@vue/shared@3.5.45'
  - vue@3.5.45
# GHSA-g3hv-75wg-m249: archiver 8 still asks for readdir-glob 3 (minimatch 10);
# readdir-glob 4 is the same API on minimatch 11.
overrides:
  readdir-glob: ^4.0.0
